server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints its assets, so they can be cached hard. index.html
    # must not be, or a redeploy leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The API is proxied under the SAME origin as the dashboard, so the browser
    # never makes a cross-origin request and CORS never enters the picture.
    # This is why VITE_API_BASE is left empty in the production build.
    location /api/ {
        proxy_pass         http://alert-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A filing PDF can be tens of megabytes; don't buffer it in nginx.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Lets Coolify's healthcheck hit the dashboard without pulling the bundle.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The API's own health endpoint, which does a real database round-trip.
    # Without this it fell through to the SPA fallback below and returned
    # index.html with a 200 — so an outside check reported "healthy" no matter
    # what state the API and database were actually in.
    location = /health {
        access_log off;
        proxy_pass         http://alert-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # SPA fallback: any unknown path renders the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
