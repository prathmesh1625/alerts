# ============================================================================
#  docker-compose.yml — the INDEPENDENT alerts stack.
#
#  Deploy this as its own Coolify resource, from the alerts repo. It shares
#  nothing with the stack serving your users: its own Postgres, its own scraper,
#  its own disk. Nothing here can reach that database, that volume, or those
#  containers, so no mistake in this repo can take down the product.
#
#  The cost of that isolation is a second scraper hitting NSE and BSE from the
#  same server IP — the one way an independent stack could still hurt
#  production. It is kept small on purpose:
#
#      production scraper   feed every 20s, 3 pages, downloads EVERY PDF
#      this scraper         feed every 20s, plus one full-day sweep every 5
#                           minutes, and downloads NOTHING
#
#  The agent downloads only the ~12% of filings that survive the title screen
#  and the prefilter. That is roughly a thirteenth of the feed traffic, which
#  keeps both services well clear of NSE's rate limiting.
#
#  Coolify: New Resource -> Docker Compose -> this repo. Set OPENAI_API_KEY and
#  ALERT_DB_PASSWORD, point alerts.equityalerts.in at it, deploy.
# ============================================================================
version: "3.8"

services:

  # --- our own database, entirely separate from production's -----------------
  alert-db:
    image: postgres:16-alpine
    container_name: alert_db
    restart: always
    environment:
      POSTGRES_USER: ${ALERT_DB_USER:-alerts}
      POSTGRES_PASSWORD: ${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      POSTGRES_DB: ${ALERT_DB_NAME:-alerts}
    volumes:
      - alert_pgdata:/var/lib/postgresql/data
    # Deliberately NOT published to the host: nothing outside this stack has
    # any business reaching it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALERT_DB_USER:-alerts}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # --- polls the NSE and BSE feeds; downloads nothing ------------------------
  alert-scraper:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_scraper
    restart: always
    command: python scraper.py
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      # Gentle on purpose - see the note at the top of this file.
      # Biggest single component of end-to-end latency. 20s matches the
      # cadence the production NSE scraper already runs at, so it is a rate
      # NSE demonstrably tolerates - but it does roughly double the feed
      # traffic from this server. Raise this first if NSE throttles.
      - SCRAPE_INTERVAL_SEC=${ALERT_SCRAPE_INTERVAL_SEC:-20}
      # NSE ignores pageNo - every page returns the same newest 20 rows - so
      # this cannot reach past them. The full day comes from the date-range
      # sweep below; this is kept only for the plain feed's single call.
      - NSE_FEED_PAGES=${ALERT_NSE_FEED_PAGES:-1}
      # How often to sweep NSE's whole day. This is the completeness
      # guarantee: without it the engine sees only the newest 20 filings and
      # anything beyond them between polls is lost for good.
      - NSE_SWEEP_INTERVAL_SEC=${ALERT_NSE_SWEEP_INTERVAL_SEC:-300}
      - BSE_FEED_PAGES=${ALERT_BSE_FEED_PAGES:-2}
      # BSE paginates properly, we just were not using it: 2 pages is 100 rows
      # and BSE published 250 across 5 pages in an ordinary day. The full-day
      # sweep runs on NSE_SWEEP_INTERVAL_SEC and stops when a page comes back
      # empty; this only caps a runaway.
      - BSE_SWEEP_MAX_PAGES=${ALERT_BSE_SWEEP_MAX_PAGES:-20}
      # Unused by this process, but config.py reads it at import.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # One HTTP request per page per cycle. It needs almost nothing.
          cpus: "0.25"
          memory: 256M

  # --- pushes alerts to WhatsApp --------------------------------------------
  #
  # Its own service on purpose. Scoring a filing and telling someone about it
  # fail for unrelated reasons, and a closed 24-hour window, an expired token
  # or a WhatsApp outage must not stop filings being analysed.
  #
  # OFF unless ALERT_WHATSAPP_ENABLED=true AND ALERT_WHATSAPP_RECIPIENTS names
  # the numbers. It sends from the same Meta phone number as the NSE bot, which
  # has 130 paying users on it, so it refuses to start rather than guess at an
  # audience - see the notes in engine/config.py.
  alert-notifier:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_notifier
    restart: always
    command: python notifier.py
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      - WHATSAPP_ENABLED=${ALERT_WHATSAPP_ENABLED:-false}
      - WHATSAPP_TOKEN=${ALERT_WHATSAPP_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${ALERT_WHATSAPP_PHONE_NUMBER_ID:-}
      # Comma-separated, full international form (91XXXXXXXXXX). Empty means
      # send to nobody, and the notifier refuses to start.
      - WHATSAPP_RECIPIENTS=${ALERT_WHATSAPP_RECIPIENTS:-}
      - WHATSAPP_TEMPLATE_NAME=${ALERT_WHATSAPP_TEMPLATE_NAME:-nse_bot}
      - WHATSAPP_MIN_SCORE=${ALERT_WHATSAPP_MIN_SCORE:-0}
      - WHATSAPP_MAX_PER_DAY=${ALERT_WHATSAPP_MAX_PER_DAY:-25}
      - WHATSAPP_MAX_AGE_MIN=${ALERT_WHATSAPP_MAX_AGE_MIN:-180}
      # Pure end-to-end latency, and one cheap indexed query.
      - WHATSAPP_POLL_SEC=${ALERT_WHATSAPP_POLL_SEC:-5}
      - PUBLIC_BASE_URL=${ALERT_PUBLIC_BASE_URL:-https://alerts.equityalerts.in}
      # Unused by this process, but config.py reads it at import.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # One indexed SELECT and an HTTPS POST per alert.
          cpus: "0.15"
          memory: 192M

  # --- records what it WOULD trade; places nothing ---------------------------
  #
  # SHADOW MODE. There is no code in this repo that can place an order - see
  # engine/trader.py and the test that asserts it. This service exists to build
  # the record that decides whether execution should ever be wired up.
  #
  # The gate is STRONG conviction, an order of at least Rs 100 Cr, AND that
  # order being at least 10% of market cap. Over 30 days that admits 8 alerts
  # and rejects 9 that clear the first two conditions.
  alert-trader:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_trader
    restart: always
    command: python trader.py
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      - TRADE_MIN_ORDER_CR=${ALERT_TRADE_MIN_ORDER_CR:-100}
      - TRADE_MIN_ORDER_TO_MCAP_PCT=${ALERT_TRADE_MIN_ORDER_TO_MCAP_PCT:-10}
      - TRADE_VALUE_INR=${ALERT_TRADE_VALUE_INR:-100000}
      - TRADE_MAX_PER_DAY=${ALERT_TRADE_MAX_PER_DAY:-3}
      - TRADE_DEDUP_DAYS=${ALERT_TRADE_DEDUP_DAYS:-5}
      # Unused by this process, but config.py reads it at import.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # One indexed SELECT and one quote lookup per alert.
          cpus: "0.15"
          memory: 192M

  # --- reads the filings worth reading, applies the formula ------------------
  alert-agent:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_agent
    restart: always
    command: python agent.py
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}

      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      - OPENAI_MODEL=${ALERT_MODEL:-gpt-4o-mini}

      # Order values are quoted in foreign currency more often than is
      # comfortable - STLTECH's contract was "Approximately USD 288 Million",
      # about Rs 2,500 Cr, recorded as Rs 28.8 Cr before the currency was read.
      # Approximate is fine: the score is logarithmic in value, so a stale rate
      # moves it by a fraction of a point. Being 80x wrong is what mattered.
      - FX_USD_INR=${ALERT_FX_USD_INR:-88}
      - FX_EUR_INR=${ALERT_FX_EUR_INR:-96}
      - FX_GBP_INR=${ALERT_FX_GBP_INR:-112}

      # Six-month price context on each alert, from the NSE Bhavcopy archive.
      # One download covers every symbol on that date, so a day of alerts costs
      # one request. A BSE-only listing has no Bhavcopy row and is reported as
      # unknown rather than guessed.
      - PRICE_HISTORY_MONTHS=${ALERT_PRICE_HISTORY_MONTHS:-6}

      # PDFs are downloaded on demand into a pruned cache, NOT archived - the
      # verdict lives in the database once a filing is analysed.
      - PDF_CACHE_DIR=/app/pdf_cache
      - PDF_CACHE_HOURS=${ALERT_PDF_CACHE_HOURS:-48}

      # --- CPU budget (parsing PDFs is ~0.34s of CPU each) ------------------
      # Screens on the announcement title before downloading OR parsing.
      # Biggest single saving; leave it on.
      - SKIP_BY_TITLE=${ALERT_SKIP_BY_TITLE:-true}
      - WORKER_THREADS=${ALERT_WORKER_THREADS:-2}
      - BATCH_SIZE=${ALERT_BATCH_SIZE:-10}
      - POLL_INTERVAL_SEC=${ALERT_POLL_INTERVAL_SEC:-5}
      # Re-score filings judged under a formula that has since changed, from
      # the signals already on disk - no PDF re-read, no model call. Runs only
      # when no new filing is waiting, so a rule fix repairing yesterday can
      # never delay today's alert.
      - RESCORE_DAYS=${ALERT_RESCORE_DAYS:-7}
      - RESCORE_BATCH=${ALERT_RESCORE_BATCH:-10}
      # How long to keep re-checking for a PDF the exchange has not published
      # yet. The retry COUNT is derived from this in config.py - pinning the
      # count instead is what silently shrank this window twice.
      - PDF_WAIT_BUDGET_SEC=${ALERT_PDF_WAIT_BUDGET_SEC:-300}
      - MAX_ANALYSIS_RETRIES=${ALERT_MAX_ANALYSIS_RETRIES:-}
      # OCR is the heaviest path there is. OCR_ENABLED=false removes the spike
      # entirely, at the cost of giving up scanned filings.
      - OCR_ENABLED=${ALERT_OCR_ENABLED:-true}
      - OCR_DPI=${ALERT_OCR_DPI:-200}
      - OCR_MAX_PAGES=${ALERT_OCR_MAX_PAGES:-3}
      - OCR_TIME_BUDGET_SEC=${ALERT_OCR_TIME_BUDGET_SEC:-20}

      # Start at 1: on first boot everything inside this window is analysed,
      # so a large value is a one-off spike in CPU *and* OpenAI spend.
      - BACKFILL_DAYS=${ALERT_BACKFILL_DAYS:-1}
      # ONLY the order-win rule is live. Profit and revenue growth are kept in
      # the code and switched back on with these, once order-win is precise
      # enough to trust. Raise the bands back to 70/45 at the same time - with
      # one rule the score spans 21-30, so they are tuned to order SIZE:
      # under Rs 10 Cr WATCH, to Rs 100 Cr MODERATE, above it STRONG.
      - PROFIT_RULE_ENABLED=${ALERT_PROFIT_RULE:-false}
      - REVENUE_RULE_ENABLED=${ALERT_REVENUE_RULE:-false}
      - ORDER_RULE_ENABLED=${ALERT_ORDER_RULE:-true}
      - BAND_STRONG=${ALERT_BAND_STRONG:-27}
      - BAND_MODERATE=${ALERT_BAND_MODERATE:-24}
      - ALERT_MIN_SCORE=${ALERT_MIN_SCORE:-20}
      # Size floor, applied to ALL FOUR rules. A filing says nothing about how
      # big the business behind it is - a shell company reporting 100% profit
      # growth on Rs 1 crore of revenue clears rule 1 exactly as a real one
      # does. A company whose market cap cannot be determined is allowed
      # through, not blocked. Set to 0 to disable.
      - MIN_MARKET_CAP_CR=${ALERT_MIN_MARKET_CAP_CR:-100}
      - MARKET_CAP_TTL_DAYS=${ALERT_MARKET_CAP_TTL_DAYS:-7}
    volumes:
      - alert_pdf_cache:/app/pdf_cache
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${ALERT_CPU_LIMIT:-0.75}"
          # Raised from 768M. pdfplumber and OCR are the memory-hungry
          # paths and an OOM kill cannot be caught in Python - the
          # process vanishes mid-cycle and Docker restarts it.
          memory: ${ALERT_MEM_LIMIT:-1536M}

  # --- read-only API ---------------------------------------------------------
  alert-api:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_api
    restart: always
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      - PDF_CACHE_DIR=/app/pdf_cache
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Kite Connect - AUTH AND READ ONLY. No order placement exists in this
      # repo. Only the API needs these: it serves the login callback that
      # exchanges the request_token, and the read-only status and margins
      # calls. The secret never leaves this process and is never stored.
      #
      # The access_token Kite issues expires at 06:00 IST the next day by
      # regulation and cannot be refreshed, so a session is a daily human act:
      # visit /api/kite/status for the login link.
      - KITE_API_KEY=${ALERT_KITE_API_KEY:-}
      - KITE_API_SECRET=${ALERT_KITE_API_SECRET:-}
    volumes:
      # Read-only: it serves cached PDFs, it must never write to them.
      - alert_pdf_cache:/app/pdf_cache:ro
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # --- the dashboard, and the only thing exposed to the internet -------------
  alert-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: alert_dashboard
    restart: always
    environment:
      # Coolify routes the domain and issues the certificate from this.
      - SERVICE_FQDN_ALERTDASHBOARD_80=https://alerts.equityalerts.in
    expose:
      - "80"
    depends_on:
      - alert-api
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # --- rule 4: volume spikes, from NSE's daily full-market Bhavcopy ----------
  alert-volume:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: alert_volume
    restart: always
    command: python volume_worker.py
    environment:
      - STANDALONE=true
      - DB_HOST=alert-db
      - DB_PORT=5432
      - DB_NAME=${ALERT_DB_NAME:-alerts}
      - DB_USER=${ALERT_DB_USER:-alerts}
      - DB_PASSWORD=${ALERT_DB_PASSWORD:?ALERT_DB_PASSWORD must be set}
      # Unused here, but config.py reads it at import.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # A spike is several times the trailing MEDIAN *and* a new window high.
      # Measured on a real session of 2,285 stocks: 3x + Rs 5 Cr produced 49
      # alerts, these defaults produce about 28. Lower them to widen the net.
      - VOLUME_SPIKE_MIN_X=${ALERT_VOLUME_SPIKE_MIN_X:-5}
      - VOLUME_MIN_TURNOVER_CR=${ALERT_VOLUME_MIN_TURNOVER_CR:-25}
      - VOLUME_LOOKBACK_SESSIONS=${ALERT_VOLUME_LOOKBACK:-20}
      - VOLUME_COOLDOWN_SESSIONS=${ALERT_VOLUME_COOLDOWN:-5}
      # First boot pulls this many days of Bhavcopy to build baselines. The
      # rule stays silent for any stock with fewer than VOLUME_MIN_SESSIONS.
      - BHAVCOPY_BACKFILL_SESSIONS=${ALERT_BHAVCOPY_BACKFILL:-30}
      - MIN_MARKET_CAP_CR=${ALERT_MIN_MARKET_CAP_CR:-100}
      - MARKET_CAP_TTL_DAYS=${ALERT_MARKET_CAP_TTL_DAYS:-7}
      # Detect spikes DURING the session too, not only after the close, so a
      # stock that spikes on Monday morning shows up on Monday morning. Costs
      # one cached market snapshot per interval regardless of how many stocks.
      - VOLUME_INTRADAY_ENABLED=${ALERT_VOLUME_INTRADAY:-true}
      - VOLUME_INTRADAY_INTERVAL_SEC=${ALERT_VOLUME_INTRADAY_INTERVAL:-300}
    depends_on:
      alert-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # One CSV download a day plus some medians. Almost nothing.
          cpus: "0.25"
          memory: 384M

volumes:
  alert_pgdata:
  alert_pdf_cache:
